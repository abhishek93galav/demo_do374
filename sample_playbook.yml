- name: a demo play
  hosts: webservers
  vars_files:
    - web-setup-vars.yaml
  become: true
  tasks:
    - name: install web pkg
      ansible.builtin.dnf:
        name: "{{ web_pkg_name }}" 
        state: latest
    - name: push web content
      ansible.builtin.copy:
        src: files/index.html
        dest: "{{ web_doc_root }}" 
    - name: starting web server
      ansible.builtin.service:
        name: "{{ web_svc_name }}"
        state: started
        enabled: true
    - name: enable web service on firewall
      ansible.posix.firewalld:
        service: http
        immediate: true
        permanent: true
        state: enabled
- name: test connections with the webservers
  hosts: localhost
  tasks:
    - ansible.builtin.uri:
        url: "http://{{ item }}.lab.example.com"
        status_code: 200
      loop: "{{ groups['webservers'] }}"
